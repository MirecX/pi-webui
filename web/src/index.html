<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pi-webui</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <h1>pi-webui</h1>
      <span id="active-session" class="active-session"></span>
      <span id="active-actions" class="active-actions">
        <button id="abort" type="button" title="Abort the in-flight turn">Abort</button>
        <button id="recycle" type="button" title="Stop this session's agent (keeps history)">Recycle</button>
        <button id="delete" type="button" title="Delete this session permanently">Delete</button>
      </span>
      <span id="app" class="ws-status-wrap"></span>
    </header>
    <div class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <span>Sessions</span>
          <button id="new" type="button" title="Create a new named session">+ New</button>
        </div>
        <ul id="session-list" class="session-list"></ul>
      </aside>
      <main>
        <div id="transcript" class="transcript" aria-live="polite"></div>
        <div id="turn-controls" class="turn-controls">
          <span id="agent-state" class="agent-state idle" title="Agent state">idle</span>
          <input id="steer-input" type="text" placeholder="Steer while running (delivered before the next LLM call)…" />
          <button id="steer-send" type="button" title="Queue a steering message">Steer</button>
          <input id="followup-input" type="text" placeholder="Follow-up when done (delivered after the agent settles)…" />
          <button id="followup-send" type="button" title="Queue a follow-up message">Follow-up</button>
        </div>
        <form id="composer" class="composer">
          <textarea
            id="prompt"
            rows="3"
            placeholder="Send a prompt to the agent… (Enter to send, Shift+Enter for newline)"
          ></textarea>
          <button id="send" type="submit">Send</button>
        </form>
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
